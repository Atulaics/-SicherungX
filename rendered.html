<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SicherungX - Data Leak Prevention</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, #38bdf8, #818cf8);
        }
        .btn-glow {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600 opacity-20 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600 opacity-20 blur-[100px]"></div>
    </div>

    <!-- Navbar -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300 py-4 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/landing" class="text-2xl font-bold tracking-tighter flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-sky-400"></i> SicherungX
            </a>
            <div class="hidden lg:flex space-x-8 text-sm font-medium">
                <a href="/landing" class="text-slate-300 hover:text-white transition">Home</a>
                <a href="/agent" class="text-slate-300 hover:text-white transition">Agent</a>
                <a href="/features" class="text-slate-300 hover:text-white transition">Features</a>
                <a href="/about" class="text-slate-300 hover:text-white transition">About Us</a>
                <a href="/support" class="text-slate-300 hover:text-white transition">Support</a>
            </div>
            <div class="flex space-x-4 items-center">
                <a href="/login" class="text-sm font-semibold text-slate-300 hover:text-white transition mr-2">Login (Admin)</a>
                <a href="/contact" class="px-5 py-2.5 rounded-full bg-gradient-to-r from-sky-400 to-indigo-500 text-white font-semibold text-sm btn-glow shadow-lg shadow-sky-500/20">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-24">
        
<div class="max-w-md mx-auto px-8 py-20">
    <div class="glass-panel p-8 rounded-2xl border border-slate-700/50 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-400 to-indigo-500"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Welcome Back</h1>
            <p class="text-sm text-slate-400">Sign in to your SicherungX account</p>
        </div>
        
        
        
        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-slate-500"></i>
                    </div>
                    <input type="text" id="username" name="username" class="block w-full pl-10 pr-3 py-2.5 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-sky-500 focus:border-sky-500 sm:text-sm transition" placeholder="admin" required>
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" id="password" name="password" class="block w-full pl-10 pr-3 py-2.5 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-sky-500 focus:border-sky-500 sm:text-sm transition" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 btn-glow transition">
                    Secure Login <i class="fa-solid fa-arrow-right ml-2 mt-0.5"></i>
                </button>
            </div>
        </form>
    </div>
</div>

    </main>

    <footer class="border-t border-slate-800 bg-slate-900/50 py-8 text-center text-slate-400">
        <p>&copy; 2026 SicherungX Data Leak Prevention. All rights reserved.</p>
    </footer>
</body>
</html>
