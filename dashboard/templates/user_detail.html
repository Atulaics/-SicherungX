{% extends "base.html" %}

{% block page_title %}User Profile{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Profile Card -->
    <div class="lg:col-span-1 space-y-6">
        <div class="glass-panel p-8 rounded-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4">
                <span id="profStatusBadge" class="hidden px-2 py-1 bg-slate-800 rounded-lg text-xs font-bold border border-slate-700"></span>
            </div>
            
            <div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 text-white flex items-center justify-center font-bold text-5xl shadow-xl shadow-indigo-500/20 mb-6 border-4 border-slate-800" id="profPic">
                -
            </div>
            <h2 class="text-2xl font-bold text-white mb-1" id="profName">Loading...</h2>
            <p class="text-slate-400 mb-2" id="profEmail">-</p>
            <p class="text-slate-500 text-sm mb-6 font-mono" id="profUser">@-</p>
            
            <div class="inline-block px-4 py-1.5 rounded-full bg-slate-800 text-xs font-semibold tracking-wide border border-slate-700 mb-8 uppercase" id="profRole">
                -
            </div>
            
            <div class="text-left space-y-4 border-t border-slate-700/50 pt-6">
                <div>
                    <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Overall Risk Score</p>
                    <div class="flex items-center gap-3 mt-2">
                        <div class="flex-1 bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700/50">
                            <div class="bg-sky-500 h-2 rounded-full transition-all duration-1000" id="riskBar" style="width: 0%"></div>
                        </div>
                        <span class="text-sm font-bold text-sky-400" id="riskText">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="glass-panel p-6 rounded-2xl">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-4 border-b border-slate-700/50 pb-2">Device Info</h3>
            <div id="deviceList" class="space-y-4">
                <p class="text-sm text-slate-500 italic">Loading bounded devices...</p>
            </div>
        </div>
    </div>
    
    <!-- Activity Logs -->
    <div class="lg:col-span-2">
        <div class="glass-panel p-6 rounded-2xl h-full flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700/50 pb-4">
                <h3 class="text-lg font-bold text-white">Activity History</h3>
                <span id="pingIndicator" class="relative flex h-3 w-3 hidden">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-sky-500"></span>
                </span>
            </div>
            
            <div class="flex-1 overflow-auto pr-2">
                <ul class="space-y-4 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-700 before:to-transparent" id="activityList">
                    <li class="text-slate-500 text-center py-8">Loading history...</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const userId = window.location.pathname.split('/').pop();

    async function fetchProfile() {
        try {
            const res = await fetch(`/api/user/${userId}`);
            if (!res.ok) throw new Error("Not found");
            const data = await res.json();
            
            // Profile Update
            const p = data.profile;
            document.getElementById('profName').textContent = p.full_name || p.username;
            document.getElementById('profEmail').textContent = p.email || 'No email attached';
            document.getElementById('profUser').textContent = '@' + p.username;
            document.getElementById('profPic').textContent = p.username[0].toUpperCase();
            document.getElementById('profRole').textContent = p.role;
            
            // Status Badge
            const badge = document.getElementById('profStatusBadge');
            badge.classList.remove('hidden');
            if (data.status === 'active') {
                badge.innerHTML = `<span class="flex items-center gap-1.5 text-emerald-400"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Agent Active</span>`;
                document.getElementById('pingIndicator').classList.remove('hidden');
            } else {
                badge.innerHTML = `<span class="flex items-center gap-1.5 text-slate-400"><span class="w-2 h-2 rounded-full bg-slate-500"></span> Agent Offline</span>`;
                document.getElementById('pingIndicator').classList.add('hidden');
            }
            
            const risk = data.overall_risk_score;
            document.getElementById('riskText').textContent = risk;
            document.getElementById('riskBar').style.width = risk + '%';
            if (risk > 70) document.getElementById('riskBar').className = 'bg-red-500 h-2 rounded-full';
            else if (risk > 30) document.getElementById('riskBar').className = 'bg-yellow-500 h-2 rounded-full';
            else document.getElementById('riskBar').className = 'bg-emerald-500 h-2 rounded-full';
            
            // Devices
            const devList = document.getElementById('deviceList');
            devList.innerHTML = '';
            if (data.devices.length === 0) {
                devList.innerHTML = '<p class="text-sm text-slate-500 italic">No devices bounded to this account.</p>';
            } else {
                data.devices.forEach(d => {
                    let blockBtnHTML = '';
                    if (p.role !== 'admin' || userId !== '{{ current_user.id }}') {
                        if (d.is_blocked) {
                            blockBtnHTML = `<button onclick="toggleDeviceBlock('${d.device_id}', 'unblock')" class="px-2 py-1 mt-2 w-full text-center bg-slate-700 hover:bg-slate-600 text-white text-[10px] font-bold tracking-widest uppercase rounded transition">Unblock Device</button>`;
                        } else {
                            blockBtnHTML = `<button onclick="toggleDeviceBlock('${d.device_id}', 'block')" class="px-2 py-1 mt-2 w-full text-center bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-[10px] font-bold tracking-widest uppercase rounded transition">Isolate Endpoint</button>`;
                        }
                    }
                    
                    const blockBadge = d.is_blocked ? '<span class="px-2 py-0.5 ml-2 bg-red-500 text-white text-[9px] rounded font-bold uppercase">Blocked</span>' : '';

                    devList.innerHTML += `
                    <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-700/50 shadow-inner text-sm relative">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="font-bold text-sky-400 truncate w-32"><i class="fa-solid fa-laptop mr-2"></i>${d.device_name} ${blockBadge}</h4>
                            <span class="text-[10px] bg-slate-900 px-2 py-0.5 rounded border border-slate-700 font-mono text-slate-400 truncate max-w-[80px]">${d.ip_address}</span>
                        </div>
                        <p class="text-xs text-slate-400 mb-1"><strong>OS:</strong> ${d.os_info}</p>
                        <p class="text-xs text-slate-400 mb-1"><strong>User:</strong> ${d.system_username}</p>
                        <p class="text-xs text-slate-500 mt-2"><strong>Last Seen:</strong> ${d.last_seen ? formatUTCtoLocal(d.last_seen) : 'Never'}</p>
                        ${blockBtnHTML}
                    </div>`;
                });
            }
            
            // Logs
            const list = document.getElementById('activityList');
            list.innerHTML = '';
            
            if (data.logs.length === 0) {
                list.innerHTML = '<li class="text-slate-500 text-center py-8 relative z-10">No recent activity found.</li>';
                return;
            }

            data.logs.forEach(log => {
                const isAnomaly = log.is_anomaly === 1;
                const iconColor = isAnomaly ? 'text-red-500' : 'text-sky-500';
                const bgColor = isAnomaly ? 'bg-red-500/10 border-red-500/30' : 'bg-slate-800/50 border-slate-700';
                
                list.innerHTML += `
                    <li class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full border border-slate-700 bg-slate-900 text-slate-500 shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 shadow z-10 ${isAnomaly ? 'border-red-500/50 text-red-500' : ''}">
                            <i class="fa-solid fa-${(log.activity_type || '').includes('USB') ? 'usb' : (log.activity_type || '').includes('FILE') ? 'file-lines' : 'network-wired'}"></i>
                        </div>
                        <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-xl border ${bgColor} shadow-sm">
                            <div class="flex items-center justify-between space-x-2 mb-1">
                                <div class="font-bold text-white">${log.activity_type || 'UNKNOWN'}</div>
                                <time class="font-mono text-xs text-slate-500">${(formatUTCtoLocal(log.timestamp).split(',')[1] || formatUTCtoLocal(log.timestamp)).trim()}</time>
                            </div>
                            <div class="text-sm text-slate-400">${log.details || ''}</div>
                        </div>
                    </li>
                `;
            });

        } catch (e) {
            console.error("fetchProfile error:", e);
            document.getElementById('activityList').innerHTML = `<li class="text-red-400 text-center py-8 relative z-10">User not found or access denied.</li>`;
        }
    }

    async function toggleDeviceBlock(deviceId, action) {
        if (!confirm(`Are you sure you want to ${action} this device? ${action === 'block' ? '\nThis will instantly lock the user\'s screen and block agent operations.' : ''}`)) return;
        try {
            const res = await fetch(`/api/device/${deviceId}/${action}`, { method: 'POST' });
            if (res.ok) {
                fetchProfile();
            } else {
                alert("Failed to perform action");
            }
        } catch (e) {
            alert("Network error");
        }
    }

    fetchProfile();
    // Poll every 5s for the specific user page to keep it updated without overwhelming
    setInterval(fetchProfile, 5000);
</script>
{% endblock %}
