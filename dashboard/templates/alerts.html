{% extends "base.html" %}

{% block page_title %}Alert Center{% endblock %}

{% block content %}
<div class="glass-panel p-6 rounded-2xl h-full flex flex-col">
    <div class="flex justify-between items-center mb-6 border-b border-slate-700/50 pb-4">
        <div>
            <h2 class="text-xl font-bold text-red-400 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> Security Alerts
            </h2>
            <p class="text-sm text-slate-400 mt-1">High-risk anomalies automatically flagged by AI.</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
            <span class="text-xs font-bold text-red-400 uppercase tracking-wider">Live System</span>
        </div>
    </div>
    
    <div class="overflow-x-auto flex-1">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="text-slate-400 text-sm border-b border-slate-700/50">
                    <th class="pb-3 pl-4 font-medium w-48">Timestamp</th>
                    <th class="pb-3 font-medium">User</th>
                    <th class="pb-3 font-medium">Activity Trigger</th>
                    <th class="pb-3 font-medium">Severity</th>
                    <th class="pb-3 font-medium">Status</th>
                    <th class="pb-3 font-medium text-right pr-4">Action</th>
                </tr>
            </thead>
            <tbody id="alertsTable" class="text-sm divide-y divide-slate-700/30">
                <tr><td colspan="6" class="text-center py-8 text-slate-500">Loading alerts...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadAlerts() {
        try {
            const res = await fetch('/api/alerts/data');
            const alerts = await res.json();
            
            const tbody = document.getElementById('alertsTable');
            tbody.innerHTML = '';
            
            if(alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-500">No alerts found. System is secure.</td></tr>';
                return;
            }

            alerts.forEach(alert => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="py-4 pl-4 text-slate-400 font-mono text-xs">${formatUTCtoLocal(alert.timestamp)}</td>
                        <td class="py-4 font-bold text-white">
                            <a href="/user/${alert.username}" class="hover:text-sky-400 transition">${alert.username}</a>
                        </td>
                        <td class="py-4 text-sky-300 font-medium">${alert.activity_type}</td>
                        <td class="py-4">
                            <span class="px-2 py-1 rounded text-xs font-bold bg-red-500/10 border border-red-500/20 text-red-400">${alert.risk_score}/100</span>
                        </td>
                        <td class="py-4">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide bg-yellow-500/20 text-yellow-500 border border-yellow-500/30"><i class="fa-solid fa-clock mr-1"></i>${alert.alert_status}</span>
                        </td>
                        <td class="py-4 text-right pr-4">
                            <button class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded text-xs transition inline-block shadow">Resolve</button>
                        </td>
                    </tr>
                `;
            });
        } catch(e) {
            console.error("Error loading alerts", e);
        }
    }
    
    loadAlerts();
    setInterval(loadAlerts, 5000); // Check for new alerts every 5s
</script>
{% endblock %}
