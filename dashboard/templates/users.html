{% extends "base.html" %}

{% block page_title %}Monitored Endpoints{% endblock %}

{% block content %}
<div class="glass-panel p-6 rounded-2xl h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-white">All Monitored Users</h2>
        <div class="px-3 py-1 bg-sky-500/20 text-sky-400 rounded-full text-xs font-bold border border-sky-500/30">Auto-updating</div>
    </div>
    
    <div class="overflow-x-auto flex-1">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-slate-700/50 text-slate-400 text-sm">
                    <th class="pb-3 pl-4 font-medium">Username</th>
                    <th class="pb-3 font-medium">Last Activity</th>
                    <th class="pb-3 font-medium">Details</th>
                    <th class="pb-3 font-medium">Risk Score</th>
                    <th class="pb-3 font-medium text-right pr-4">Action</th>
                </tr>
            </thead>
            <tbody id="logsTable" class="text-sm divide-y divide-slate-700/30">
                <tr><td colspan="5" class="text-center py-8 text-slate-500">Loading user endpoints...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadEndpointLogs() {
        try {
            const res = await fetch('/api/logs');
            const logs = await res.json();
            
            // Group by latest per user
            const usersMap = {};
            logs.forEach(log => {
                if(!usersMap[log.username]) usersMap[log.username] = log;
            });
            
            const tbody = document.getElementById('logsTable');
            tbody.innerHTML = '';
            
            Object.values(usersMap).forEach(log => {
                let riskColor = log.risk_score > 70 ? 'text-red-400 bg-red-500/10 border-red-500/20' : 
                                log.risk_score > 30 ? 'text-yellow-400 bg-yellow-500/10 border-yellow-500/20' : 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/30 transition group">
                        <td class="py-4 pl-4 font-bold text-white flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-desktop"></i>
                            </div>
                            ${log.username}
                        </td>
                        <td class="py-4 text-slate-400">
                            <span class="block text-sky-300 font-medium">${log.activity_type}</span>
                            <span class="text-xs font-mono">${formatUTCtoLocal(log.timestamp)}</span>
                        </td>
                        <td class="py-4 text-slate-400 max-w-xs truncate" title="${log.details}">${log.details}</td>
                        <td class="py-4">
                            <span class="px-2 py-1 rounded text-xs font-bold border ${riskColor}">${log.risk_score}</span>
                        </td>
                        <td class="py-4 text-right pr-4">
                            <a href="/user/${log.username}" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded text-xs transition inline-block shadow">Investigate</a>
                        </td>
                    </tr>
                `;
            });
        } catch(e) {
            console.error("Error loading endpoint logs", e);
        }
    }
    
    loadEndpointLogs();
    setInterval(loadEndpointLogs, 5000);
</script>
{% endblock %}
